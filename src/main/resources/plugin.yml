name: STAFFJOBS
version: 1.0.0
main: com.fonzzscripter.staffjobs.StaffJobsPlugin
api-version: '1.21'
author: FonzzScripter
description: Advanced Server Staff Management

commands:
  staffmenu:
    description: Open STAFFJOBS management menu
    usage: /staffmenu
    permission: staffjobs.use

  report:
    description: Report a server bug
    usage: /report <message>
    permission: staffjobs.report

permissions:
  staffjobs.use:
    description: Open staff menu
    default: op

  staffjobs.report:
    description: Submit reports
    default: true

  staffjobs.kick:
    description: Kick players
    default: op

  staffjobs.ban:
    description: Ban players
    default: op

  staffjobs.freeze:
    description: Freeze players
    default: op

  staffjobs.protect.bypass:
    description: Bypass staff hierarchy
    default: false
